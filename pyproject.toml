[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
flybridge-core = { workspace = true }
flybridge-application = { workspace = true }
flybridge-orca = { workspace = true }
flybridge-github = { workspace = true }
flybridge-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
