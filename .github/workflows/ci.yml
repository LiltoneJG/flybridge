name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"
      - run: uv sync --all-packages
      - run: uv lock --check
      # GitHub Actions materializes secrets.PRIVATE_AUDIT_CONFIG into the
      # gitignored checkout file that pre-commit and local checks use:
      #   uv run python scripts/public_audit.py --audit-config .private-audit.yaml
      # Pull requests do not receive the private deny list, so they skip that hook.
      - run: |
          if [ "${{ github.event_name }}" = push ]; then
            printf '%s' "$PRIVATE_AUDIT_CONFIG" > .private-audit.yaml
          else
            export SKIP=public-source-privacy-audit
          fi
          uv run pre-commit run --all-files
        env:
          PRIVATE_AUDIT_CONFIG: ${{ github.event_name == 'push' && secrets.PRIVATE_AUDIT_CONFIG || '' }}
      - run: uv run python scripts/test.py -q
      - run: uv build --all-packages
