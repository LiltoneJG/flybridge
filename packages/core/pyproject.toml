[project]
name = "flybridge-core"
version = "1.0.0"
description = "Deterministic workflow state and resource scheduling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
